<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reunión Activa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .time-display {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
        }

        .time-label {
            text-align: center;
            color: #666;
            margin-top: 5px;
            font-size: 14px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-box h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-box .value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .panel h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .participant-item {
            background: #f8f9fa;
            padding: 18px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .participant-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .participant-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .participant-info {
            flex: 1;
        }

        .participant-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .participant-time {
            font-size: 14px;
            opacity: 0.8;
        }

        .participant-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .timer {
            font-size: 24px;
            font-weight: 700;
            min-width: 80px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .timer.active {
            color: #ff6b6b;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-talk {
            background: #28a745;
            color: white;
        }

        .btn-talk:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .btn-complete {
            background: #ff6b6b;
            color: white;
        }

        .btn-complete:hover {
            background: #ee5a5a;
            transform: scale(1.05);
        }

        .btn-pause {
            background: #ffa726;
            color: white;
        }

        .btn-pause:hover {
            background: #fb8c00;
            transform: scale(1.05);
        }

        .transfer-form {
            background: #f0f4ff;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }

        .transfer-label {
            font-size: 14px;
            color: #666;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .transfer-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .transfer-row select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .transfer-row select:focus {
            outline: none;
            border-color: #667eea;
        }

        .transfer-arrow {
            color: #667eea;
            font-weight: 700;
            font-size: 18px;
        }

        .transfer-amount {
            width: 110px;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .transfer-amount:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-transfer {
            background: #667eea;
            color: white;
            padding: 8px 20px;
            font-size: 14px;
        }

        .btn-transfer:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-talked {
            background: #6c757d;
            color: white;
            cursor: not-allowed;
        }

        .talked-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .talked-item {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .talked-name {
            font-size: 16px;
            font-weight: 500;
        }

        .talked-time {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        .charla-notice {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .charla-notice h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .charla-time {
            font-size: 32px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Reunión en Progreso</h1>
            <div class="time-display" id="currentTime"></div>
            <div class="time-label">UTC-3 (Buenos Aires)</div>
            <div class="stats-row">
                <div class="stat-box">
                    <h3>Tiempo Transcurrido</h3>
                    <div class="value" id="elapsedTime">0:00</div>
                </div>
                <div class="stat-box">
                    <h3>Tiempo Restante</h3>
                    <div class="value" id="remainingTime">60:00</div>
                </div>
                <div class="stat-box">
                    <h3>Participantes Restantes</h3>
                    <div class="value" id="remainingParticipants">0</div>
                </div>
            </div>
        </div>

        <div id="charlaNotice" class="charla-notice" style="display: none;">
            <h3>⏱️ Tiempo de Charla</h3>
            <div class="charla-time" id="charlaTimeDisplay">0:00 restante</div>
        </div>

        <div class="main-content">
            <div class="panel">
                <h2>Participantes Activos</h2>
                <div id="transferForm" class="transfer-form" style="display: none;">
                    <div class="transfer-label">Traspasar tiempo</div>
                    <div class="transfer-row">
                        <select id="transferFromSel"></select>
                        <span class="transfer-arrow">→</span>
                        <select id="transferToSel"></select>
                        <input type="number" id="transferAmount" class="transfer-amount" min="1" step="1" placeholder="Segundos" />
                        <button class="btn-transfer" id="transferBtn">Traspasar</button>
                    </div>
                </div>
                <div id="activeParticipants"></div>
            </div>

            <div class="panel">
                <h2>Ya Hablaron</h2>
                <div class="talked-list" id="talkedList"></div>
            </div>
        </div>
    </div>

    <script>
        let meetingData = JSON.parse(sessionStorage.getItem('meetingData'));
        
        if (!meetingData) {
            alert('No se encontraron datos de la reunión. Por favor vuelve atrás para configurar la reunión.');
            window.location.href = 'meeting-leader.html';
        }

        let names = [...meetingData.names];
        let talkedParticipants = [];
        let currentSpeaker = null;
        let currentSpeakerStartTime = null;
        let charlaTimeUsed = 0;
        let charlaTimeRemaining = meetingData.charlaMinutes * 60;
        
        // Store allocated times for each participant (only updates when no one is speaking)
        let allocatedTimes = {};

        // Pause state for the current speaker
        let speakerPaused = false;
        let speakerPauseStart = null;
        let speakerTotalPaused = 0;

        // Timestamp of the last "idle tick" (no speaker, meeting in progress).
        // Used to absorb dead time into the remaining participants' budgets.
        let lastIdleTick = null;

        // Persist runtime state so a page refresh doesn't blow away the meeting.
        const STATE_KEY = 'meetingState';
        let stateRestored = false;

        function saveState() {
            try {
                sessionStorage.setItem(STATE_KEY, JSON.stringify({
                    names,
                    talkedParticipants,
                    allocatedTimes,
                    currentSpeaker,
                    currentSpeakerStartTime,
                    charlaTimeRemaining,
                    speakerPaused,
                    speakerPauseStart,
                    speakerTotalPaused
                }));
            } catch (e) { /* storage full / disabled — ignore */ }
        }

        function restoreState() {
            try {
                const raw = sessionStorage.getItem(STATE_KEY);
                if (!raw) return false;
                const s = JSON.parse(raw);
                if (!s || typeof s !== 'object') return false;
                if (Array.isArray(s.names)) names = s.names;
                if (Array.isArray(s.talkedParticipants)) talkedParticipants = s.talkedParticipants;
                if (s.allocatedTimes && typeof s.allocatedTimes === 'object') allocatedTimes = s.allocatedTimes;
                currentSpeaker = typeof s.currentSpeaker === 'string' ? s.currentSpeaker : null;
                currentSpeakerStartTime = typeof s.currentSpeakerStartTime === 'number' ? s.currentSpeakerStartTime : null;
                if (typeof s.charlaTimeRemaining === 'number') charlaTimeRemaining = s.charlaTimeRemaining;
                speakerPaused = !!s.speakerPaused;
                speakerPauseStart = typeof s.speakerPauseStart === 'number' ? s.speakerPauseStart : null;
                speakerTotalPaused = typeof s.speakerTotalPaused === 'number' ? s.speakerTotalPaused : 0;
                // Don't restore lastIdleTick — start fresh so we don't deduct a huge gap
                lastIdleTick = null;
                return true;
            } catch (e) {
                return false;
            }
        }

        stateRestored = restoreState();

        function tickIdle() {
            const { hasStarted } = calculateMeetingDates();
            if (!hasStarted || currentSpeaker || names.length === 0) {
                lastIdleTick = null;
                return;
            }
            const now = Date.now();
            if (lastIdleTick !== null) {
                const deltaSec = (now - lastIdleTick) / 1000;
                if (deltaSec > 0) {
                    const perPerson = deltaSec / names.length;
                    names.forEach(n => {
                        allocatedTimes[n] = Math.max(0, (allocatedTimes[n] || 0) - perPerson);
                    });
                }
            }
            lastIdleTick = now;
        }

        function getSpeakerElapsed() {
            if (!currentSpeaker || !currentSpeakerStartTime) return 0;
            const end = speakerPaused ? speakerPauseStart : Date.now();
            return Math.max(0, (end - currentSpeakerStartTime - speakerTotalPaused) / 1000);
        }

        function pauseSpeaker() {
            if (!currentSpeaker || speakerPaused) return;
            speakerPaused = true;
            speakerPauseStart = Date.now();
            render();
        }

        function resumeSpeaker() {
            if (!currentSpeaker || !speakerPaused) return;
            speakerTotalPaused += Date.now() - speakerPauseStart;
            speakerPaused = false;
            speakerPauseStart = null;
            render();
        }
        
        // Calculate meeting start and end dates in UTC-3
        function calculateMeetingDates() {
            const [startHour, startMin] = meetingData.startTime.split(':').map(Number);
            const [endHour, endMin] = meetingData.endTime.split(':').map(Number);
            
            // Get current UTC-3 time
            const now = new Date();
            const utc3Time = new Date(now.getTime());
            
            // Create meeting start date (today at the specified time in UTC-3)
            const startDate = new Date(utc3Time);
            startDate.setHours(startHour, startMin, 0, 0);
            
            // Create meeting end date (today at the specified time in UTC-3)
            const endDate = new Date(utc3Time);
            endDate.setHours(endHour, endMin, 0, 0);
            
            // If meeting hasn't started yet, show 0 elapsed
            if (now < startDate) {
                return { startDate, endDate, hasStarted: false };
            }
            
            return { startDate, endDate, hasStarted: true };
        }

        function getUTCTime() {
            const now = new Date();
            const utc3Time = new Date(now.getTime());
            return utc3Time;
        }

        function updateCurrentTime() {
            const utc3Time = getUTCTime();
            const timeStr = utc3Time.toLocaleTimeString('es-AR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('currentTime').textContent = timeStr;
        }

        function calculateTimeStats() {
            const { startDate, endDate, hasStarted } = calculateMeetingDates();
            const now = new Date();
            
            const totalDuration = (endDate - startDate) / 1000 / 60;
            
            let elapsed = 0;
            if (hasStarted) {
                elapsed = (now - startDate) / 1000 / 60;
            }
            
            const remaining = Math.max(0, totalDuration - elapsed);
            
            return { elapsed, remaining, totalDuration };
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function calculateAllocatedTimes() {
            const { remaining } = calculateTimeStats();
            const remainingTimeSeconds = remaining * 60;
            const activeCount = names.length;
            const timePerPerson = activeCount > 0 ? remainingTimeSeconds / activeCount : 0;
            return Math.max(0, timePerPerson);
        }

        function getSpeakerOverage() {
            if (!currentSpeaker || !currentSpeakerStartTime) return 0;
            const allocated = allocatedTimes[currentSpeaker] || 0;
            return Math.max(0, getSpeakerElapsed() - allocated);
        }

        function getPauseTimeTotal() {
            const inProgress = speakerPaused && speakerPauseStart ? (Date.now() - speakerPauseStart) : 0;
            return (speakerTotalPaused + inProgress) / 1000;
        }

        function getTimeForParticipant(name) {
            if (talkedParticipants.find(p => p.name === name)) return 0;
            if (!names.includes(name)) return 0;

            // Current speaker: their own countdown (can go to 0, then overage starts)
            if (currentSpeaker === name) {
                const allocatedTime = allocatedTimes[name] || 0;
                if (currentSpeakerStartTime) {
                    return Math.max(0, allocatedTime - getSpeakerElapsed());
                }
                return allocatedTime;
            }

            const baseTime = allocatedTimes[name] || 0;

            // While someone else is speaking, two things reduce others' time:
            //   - overage: speaker exceeded their allocation (active speech beyond budget)
            //   - pause: time lost while the speaker's timer is frozen
            // Both are absorbed by the remaining active participants equally.
            if (currentSpeaker) {
                const deduction = getSpeakerOverage() + getPauseTimeTotal();
                if (deduction > 0) {
                    const otherCount = names.filter(n => n !== currentSpeaker).length;
                    if (otherCount > 0) {
                        return Math.max(0, baseTime - deduction / otherCount);
                    }
                }
            }

            return baseTime;
        }

        function updateAllocatedTimes() {
            // Only update allocated times when no one is speaking
            if (!currentSpeaker) {
                const timePerPerson = calculateAllocatedTimes();
                
                // Update the allocated time for each active participant
                names.forEach(name => {
                    // Make sure they haven't already spoken
                    if (!talkedParticipants.find(p => p.name === name)) {
                        allocatedTimes[name] = timePerPerson;
                    }
                });
                
                // Clean up allocated times for people who have spoken
                Object.keys(allocatedTimes).forEach(name => {
                    if (talkedParticipants.find(p => p.name === name) || !names.includes(name)) {
                        delete allocatedTimes[name];
                    }
                });
            }
        }

        function resetSpeakerState() {
            currentSpeaker = null;
            currentSpeakerStartTime = null;
            speakerPaused = false;
            speakerPauseStart = null;
            speakerTotalPaused = 0;
        }

        // Persist the current speaker's in-flight state into allocatedTimes:
        //   - speaker's own allocation drops by how much they actually spoke
        //   - overage + paused time is absorbed evenly by the other active participants
        function commitSpeakerState() {
            if (!currentSpeaker || !currentSpeakerStartTime) return 0;
            const speakerName = currentSpeaker;
            const elapsed = getSpeakerElapsed();
            const deduction = getSpeakerOverage() + getPauseTimeTotal();

            allocatedTimes[speakerName] = Math.max(0, (allocatedTimes[speakerName] || 0) - elapsed);

            const others = names.filter(n => n !== speakerName);
            if (deduction > 0 && others.length > 0) {
                const perOther = deduction / others.length;
                others.forEach(n => {
                    allocatedTimes[n] = Math.max(0, (allocatedTimes[n] || 0) - perOther);
                });
            }
            return elapsed;
        }

        function startSpeaking(name) {
            if (currentSpeaker === name) return;
            if (talkedParticipants.find(p => p.name === name)) return;
            if (!names.includes(name)) return;

            // If switching mid-speech, freeze the previous speaker's remaining time.
            if (currentSpeaker && currentSpeaker !== name) {
                commitSpeakerState();
                resetSpeakerState();
            }

            // Safety net: if this participant never got an allocation, fall back to an equal share.
            if (allocatedTimes[name] === undefined) {
                allocatedTimes[name] = calculateAllocatedTimes();
            }

            currentSpeaker = name;
            currentSpeakerStartTime = Date.now();
            speakerPaused = false;
            speakerPauseStart = null;
            speakerTotalPaused = 0;
        }

        function markAsTalked(name) {
            if (talkedParticipants.find(p => p.name === name)) return;
            const index = names.indexOf(name);
            if (index === -1) return;

            let timeSpoken = 0;
            if (currentSpeaker === name && currentSpeakerStartTime) {
                timeSpoken = getSpeakerElapsed();
                // Distribute overage/pause to the others BEFORE removing this person.
                const deduction = getSpeakerOverage() + getPauseTimeTotal();
                const others = names.filter(n => n !== name);
                if (deduction > 0 && others.length > 0) {
                    const perOther = deduction / others.length;
                    others.forEach(n => {
                        allocatedTimes[n] = Math.max(0, (allocatedTimes[n] || 0) - perOther);
                    });
                }
                resetSpeakerState();
            }

            // Their unused time (if any) goes back to the remaining active participants.
            const speakerAllocated = allocatedTimes[name] || 0;
            const leftover = Math.max(0, speakerAllocated - timeSpoken);

            names.splice(index, 1);
            talkedParticipants.push({ name: name, timeSpoken: timeSpoken });
            delete allocatedTimes[name];

            if (leftover > 0 && names.length > 0) {
                const perOther = leftover / names.length;
                names.forEach(n => {
                    allocatedTimes[n] = (allocatedTimes[n] || 0) + perOther;
                });
            }

            render();
        }

        function syncTransferForm() {
            const form = document.getElementById('transferForm');
            if (names.length < 2) {
                form.style.display = 'none';
                return;
            }
            form.style.display = '';

            const fromSel = document.getElementById('transferFromSel');
            const toSel = document.getElementById('transferToSel');

            // Only rebuild options if names changed (preserves focus/selection/input)
            const currentOptions = Array.from(fromSel.options).map(o => o.value);
            const sameOptions = currentOptions.length === names.length
                && currentOptions.every((v, i) => v === names[i]);
            if (sameOptions) return;

            const prevFrom = fromSel.value;
            const prevTo = toSel.value;

            fromSel.innerHTML = '';
            toSel.innerHTML = '';
            names.forEach(n => {
                fromSel.add(new Option(n, n));
                toSel.add(new Option(n, n));
            });

            fromSel.value = names.includes(prevFrom) ? prevFrom : names[0];
            if (names.includes(prevTo) && prevTo !== fromSel.value) {
                toSel.value = prevTo;
            } else {
                toSel.value = names.find(n => n !== fromSel.value) || names[0];
            }
        }

        function doTransfer(from, to, seconds) {
            if (!from || !to || from === to) {
                alert('Elegí dos participantes distintos');
                return;
            }
            if (!Number.isFinite(seconds) || seconds <= 0) {
                alert('Ingresá una cantidad válida en segundos');
                return;
            }
            if (!names.includes(from) || !names.includes(to)) return;

            // Real remaining for the source. If they're the current speaker, subtract elapsed.
            let available = allocatedTimes[from] || 0;
            if (currentSpeaker === from) {
                available = Math.max(0, available - getSpeakerElapsed());
            }
            if (available < seconds) {
                alert(`${from} solo tiene ${formatTime(available)} disponibles`);
                return;
            }

            allocatedTimes[from] = Math.max(0, (allocatedTimes[from] || 0) - seconds);
            allocatedTimes[to] = (allocatedTimes[to] || 0) + seconds;
            render();
        }

        function updateCharlaNotice() {
            const charlaNotice = document.getElementById('charlaNotice');
            const charlaDisplay = document.getElementById('charlaTimeDisplay');
            
            const { elapsed } = calculateTimeStats();
            const charlaRemaining = charlaTimeRemaining - (elapsed * 60);
            
            if (charlaRemaining > 0 && charlaTimeRemaining > 0) {
                charlaNotice.style.display = 'block';
                charlaDisplay.textContent = formatTime(charlaRemaining) + ' restante';
            } else {
                charlaNotice.style.display = 'none';
            }
        }

        function updateCountdowns() {
            const { elapsed, remaining } = calculateTimeStats();
            
            document.getElementById('elapsedTime').textContent = formatTime(elapsed * 60);
            document.getElementById('remainingTime').textContent = formatTime(remaining * 60);
            
            updateCharlaNotice();
        }

        function render() {
            const activeDiv = document.getElementById('activeParticipants');
            const talkedDiv = document.getElementById('talkedList');
            const remainingCount = document.getElementById('remainingParticipants');
            
            activeDiv.innerHTML = '';
            talkedDiv.innerHTML = '';

            // Only count people who haven't spoken
            remainingCount.textContent = names.length;

            // Keep transfer form's select options in sync (without recreating the form)
            syncTransferForm();

            if (names.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = '¡Todos los participantes han hablado!';
                activeDiv.appendChild(empty);
            } else {
                names.forEach(name => {
                    if (talkedParticipants.find(p => p.name === name)) return;

                    const item = document.createElement('div');
                    item.className = 'participant-item' + (currentSpeaker === name ? ' active' : '');
                    item.setAttribute('data-name', name);

                    const remainingForName = getTimeForParticipant(name);
                    const timerValue = formatTime(remainingForName);
                    const allocatedTime = formatTime(allocatedTimes[name] || 0);

                    const info = document.createElement('div');
                    info.className = 'participant-info';
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'participant-name';
                    nameDiv.textContent = name;
                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'participant-time';
                    timeDiv.textContent = 'Asignado: ' + allocatedTime;
                    info.appendChild(nameDiv);
                    info.appendChild(timeDiv);

                    const actions = document.createElement('div');
                    actions.className = 'participant-actions';
                    const timer = document.createElement('div');
                    timer.className = 'timer' + (currentSpeaker === name && !speakerPaused && remainingForName < 10 ? ' active' : '');
                    timer.textContent = speakerPaused && currentSpeaker === name ? timerValue + ' ⏸' : timerValue;

                    actions.appendChild(timer);

                    if (currentSpeaker === name) {
                        const btnPause = document.createElement('button');
                        btnPause.className = 'btn-pause';
                        btnPause.textContent = speakerPaused ? 'Reanudar' : 'Pausa';
                        btnPause.addEventListener('click', () => speakerPaused ? resumeSpeaker() : pauseSpeaker());
                        actions.appendChild(btnPause);
                    } else {
                        const btnTalk = document.createElement('button');
                        btnTalk.className = 'btn-talk';
                        btnTalk.textContent = 'Empezar';
                        btnTalk.addEventListener('click', () => startSpeaking(name));
                        actions.appendChild(btnTalk);
                    }

                    const btnDone = document.createElement('button');
                    btnDone.className = 'btn-complete';
                    btnDone.textContent = 'Ya Habló';
                    btnDone.addEventListener('click', () => markAsTalked(name));
                    actions.appendChild(btnDone);

                    item.appendChild(info);
                    item.appendChild(actions);
                    activeDiv.appendChild(item);
                });
            }

            if (talkedParticipants.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = 'Nadie ha hablado aún';
                talkedDiv.appendChild(empty);
            } else {
                talkedParticipants.forEach(person => {
                    const item = document.createElement('div');
                    item.className = 'talked-item';
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'talked-name';
                    nameSpan.textContent = person.name;
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'talked-time';
                    timeSpan.textContent = formatTime(person.timeSpoken);
                    item.appendChild(nameSpan);
                    item.appendChild(timeSpan);
                    talkedDiv.appendChild(item);
                });
            }
        }

        function updateDisplays() {
            updateCurrentTime();
            updateCountdowns();
            tickIdle();

            // Re-render to update everything dynamically
            render();

            // Persist the latest state in case the page reloads
            saveState();
        }

        window.startSpeaking = startSpeaking;
        window.markAsTalked = markAsTalked;

        // Wire up the transfer button once — the form lives outside the render loop
        document.getElementById('transferBtn').addEventListener('click', () => {
            const amtInput = document.getElementById('transferAmount');
            doTransfer(
                document.getElementById('transferFromSel').value,
                document.getElementById('transferToSel').value,
                parseFloat(amtInput.value)
            );
            amtInput.value = '';
        });

        // Initialize allocated times only if we didn't just restore prior state
        if (!stateRestored) {
            updateAllocatedTimes();
        }

        // Update every second
        setInterval(updateDisplays, 1000);
        
        render();
        updateDisplays();
    </script>
</body>
</html>
